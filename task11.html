<html lang="en">
    <head>
        <title> task2 </title>
        <style>
            div{height: 100px;width: 200px; background-color: cyan;border: 10px solid black;margin: 20px; float: inline-start;}
            .p1:hover{transform: rotate(50deg);background-color: tomato;align:center}
            .p2:hover{transform: rotatex(180deg);background-color: tomato;align:center}
            .p3:hover{transform: rotatey(180deg);background-color: tomato;align:center}
            .p4:hover{transform: skew(20deg,0deg);background-color: tomato;align:center}
            .p5:hover{transform: scale(2,0.5);background-color: tomato;align:center}
            .p6:hover{transform: scalex(2);background-color: tomato;align:center}
            .p7:hover{transform: scaley(2);background-color: tomato;align:center}
            .p8:hover{transform: translate(50px,100px);background-color: tomato;align:center}
            .p9:hover{transform: skewX(30deg);background-color: tomato;align:center}
            .p10:hover{transform: skewY(30deg);background-color: tomato;align:center}
        </style>
    </head>
    <body>
        <div class="p1"> rotate 50 </div>
        <div class="p2"> rotatex 180</div>
        <div class="p3"> rotatey 180 </div>
        <div class="p4"> skew(20deg,0deg) </div>
        <div class="p5"> scale(2,0.5) </div>
        <div class="p6"> scalex(2) </div>
        <div class="p7"> scaley(2) </div>
        <div class="p8">translate(50px,100px) </div>
        <div class="p9"> skewX(30deg) </div>
        <div class="p10"> skewY(30deg) </div>
    </body>
</html>
