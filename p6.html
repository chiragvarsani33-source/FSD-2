<html>
    <head>
        <title> CSS3</title>
        <style>
            div {background-color: yellow}
            div>p {color: red}
            p {color: green}
            p>div {color: green}
        </style>
    </head>
    <body>
        <div> 
            <p> i am inside div </p>
        </div>
        <p> i am outside div </p>
        <p> <div> hello</div></p>
    </body>
</html>
