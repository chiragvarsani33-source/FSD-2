<html lang="en">
    <head>
        <title> task2 </title>
        <style> 
            div{position: relative;animation-name: my;height: 200px;width: 200px;
                background-color: cyan;animation-duration: 5s;
                animation-iteration-count: infinite}
                @keyframes my{
                    0%{background-color: red; top: 0px; left: 0px;border-radius: 0%;}  
                    25%{background-color: blue;top: 0px; left: 600px;border-radius: 50%;}
                    50%{background-color: green;top: 400px; left: 600px;border-radius: 0%;}
                    75%{background-color: yellow;top: 400px; left: 0px;border-radius: 50%;}
                    100%{background-color: red; top: 0px; left: 0px;border-radius: 0%;}
                }
        </style>
    </head>
    <body>
        <div> </div>
    </body>
</html>
