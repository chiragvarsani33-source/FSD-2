<html lang="en">
    <head>
        <title> task2 </title>
        <style> 
            div{position: relative;animation-name: my;height: 200px;width: 200px;
                background-color: cyan;animation-duration: 5s;
                animation-iteration-count: infinite}
                @keyframes my{
                    0%{ left: 0px;top: 0%;border-radius: 0%;}  
                    50%{top: 400px; left: 300px;transform:rotate(720deg);border-radius: 50%;}
                    100%{background-color: green;top: 0px; left: 600px;border-radius: 0%;}
                }
        </style>
    </head>
    <body>
        <div> </div>
    </body>
</html>
