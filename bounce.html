<html lang="en">
    <head>
        <title> task2 </title>
        <style> 
            .bounce{position: relative;animation-name: box;height: 100px;width: 100px;top: 200px;left: 100px;
                border-radius: 50%;
                background-color: cyan;animation-duration: 1s;
                animation-iteration-count: infinite;animation-direction: alternate;}
                @keyframes box{
                    from{
                        transform: translateY(-150px);
                        
                    }
                    to{
                        transform: translateY(150px);
                        opacity:0.1; 
                    }
                    
                }
        </style>
    </head>
    <body>
        <div class="bounce"> </div>
    </body>
</html>
